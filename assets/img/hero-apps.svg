<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 32" width="460" height="320">
  <title>Teamvane apps: planning poker cards and retrospective sticky notes</title>
  <!-- Planning Poker's two cards (assets/img/cards.svg), at the back on the left -->
  <g transform="translate(0 1) scale(1.15)">
    <rect x="3.5" y="3" width="11" height="15" rx="2" fill="#579DFF" transform="rotate(-14 9 10.5)"/>
    <g transform="rotate(8 14.5 13.5)">
      <rect x="9" y="6" width="11" height="15" rx="2" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.6"/>
      <path d="M14.5 9.6 L17.4 13.5 L14.5 17.4 L11.6 13.5 Z" fill="#0C66E4"/>
    </g>
  </g>
  <!-- Retrospectives' three sticky notes (assets/img/retro-logo.svg), in front on the right -->
  <g transform="translate(21.5 8.5) scale(0.95)">
    <g transform="rotate(-8 6.5 7)">
      <rect x="1.5" y="2.5" width="10" height="9" rx="1.8" fill="#22A06B" stroke="#FFFFFF" stroke-width="1"/>
      <rect x="3.5" y="5" width="6" height="1.4" rx="0.7" fill="#FFFFFF"/>
      <rect x="3.5" y="7.6" width="3.8" height="1.4" rx="0.7" fill="#FFFFFF"/>
    </g>
    <g transform="rotate(7 17.5 7)">
      <rect x="12.5" y="2.5" width="10" height="9" rx="1.8" fill="#E2483D" stroke="#FFFFFF" stroke-width="1"/>
      <rect x="14.5" y="5" width="6" height="1.4" rx="0.7" fill="#FFFFFF"/>
      <rect x="14.5" y="7.6" width="3.8" height="1.4" rx="0.7" fill="#FFFFFF"/>
    </g>
    <g transform="rotate(-3 12 16.5)">
      <rect x="7" y="11.75" width="10" height="9.5" rx="1.8" fill="#1D7AFC" stroke="#FFFFFF" stroke-width="1"/>
      <rect x="9" y="14.5" width="6" height="1.4" rx="0.7" fill="#FFFFFF"/>
      <rect x="9" y="17.1" width="3.8" height="1.4" rx="0.7" fill="#FFFFFF"/>
    </g>
