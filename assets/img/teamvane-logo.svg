<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <title>Teamvane</title>
  <!-- A weather vane: it shows which way the team is heading -->
  <rect width="144" height="144" rx="32" fill="#0C66E4"/>
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Pole and base -->
    <path d="M72 66 V108" stroke-width="7"/>
    <path d="M54 110 H90" stroke-width="7"/>
    <!-- Arrow, tilted slightly upward -->
    <g transform="rotate(-10 72 58)">
      <path d="M30 58 H104" stroke-width="7"/>
      <!-- Tail feathers -->
      <path d="M42 58 L28 44 M42 58 L28 72" stroke-width="6"/>
      <path d="M54 58 L40 44 M54 58 L40 72" stroke-width="6"/>
    </g>
  </g>
  <!-- Arrowhead -->
  <g transform="rotate(-10 72 58)">
    <path d="M100 44 L120 58 L100 72 Z" fill="#FFFFFF"/>
  </g>
  <!-- Pivot -->
  <circle cx="72" cy="58" r="8" fill="#0C66E4" stroke="#FFFFFF" stroke-width="5"/>
</svg>
